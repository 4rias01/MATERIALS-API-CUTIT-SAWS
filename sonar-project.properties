# Proyecto en SonarCloud. Completar organización y llave con los valores que muestra
# SonarCloud al importar el repositorio (Administration > Update key).
sonar.organization=4rias01
sonar.projectKey=4rias01_MATERIALS-API-CUTIT-SAWS
sonar.projectName=MATERIALS-API-CUTIT-SAWS

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Reportes que genera el paso de pruebas del pipeline.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reporte-pruebas.xml

# El paso del pipeline espera el resultado y falla si no se aprueba el quality gate:
# así el despliegue solo ocurre con el quality gate aprobado.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
