# Migraciones versionadas de la base de datos (Alembic).
# La URL de conexión NO va aquí: migrations/env.py la toma de las variables de entorno
# (DATABASE_URL o POSTGRES_*), igual que la API.
#
#   alembic upgrade head                      # aplica todas las migraciones
#   alembic revision --autogenerate -m "..."  # nueva migración a partir de los modelos
#   alembic check                             # falla si los modelos y las migraciones difieren

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
