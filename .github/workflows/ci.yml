# Integración continua de la célula Materiales y Fórmulas (rama develop).
#
# Corre en cada Pull Request hacia develop y en cada push a develop:
#   1. calidad ........ linter (ruff), type checker (mypy) y validación de arquitectura (import-linter).
#   2. pruebas ........ unitarias e integración contra PostgreSQL (docker compose), cobertura
#                       mínima del 80 % y análisis de SonarCloud con quality gate.
#   3. imagen-docker .. verifica que la imagen Docker se construye (no la publica).
# La configuración de ruff, mypy e import-linter está en pyproject.toml.
#
# Secretos (Settings > Secrets and variables > Actions):
#   SONAR_TOKEN                        token del proyecto en SonarCloud
#   POSTGRES_USER, POSTGRES_PASSWORD   credenciales de la base de datos de pruebas

name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Linter, type checker y arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Linter (ruff)
        run: ruff check --output-format=github .

      - name: Type checker (mypy)
        run: mypy

      - name: Validación de arquitectura (import-linter)
        run: lint-imports

  pruebas:
    name: Pruebas, cobertura y SonarCloud
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: materiales_formulas_test
      POSTGRES_PUERTO_HOST: "5433"
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # SonarCloud usa el historial para asignar cada problema a su cambio

      - name: Levantar PostgreSQL (docker-compose.yml + override)
        run: docker compose up -d --wait postgres

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests con cobertura
        run: |
          export TEST_DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PUERTO_HOST}/${POSTGRES_DB}"
          pytest --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80 --junitxml=reporte-pruebas.xml

      - name: Análisis de SonarCloud y quality gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # sonar-project.properties tiene sonar.qualitygate.wait=true: si el quality gate
        # no se aprueba, este paso falla.

  imagen-docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t materiales-formulas-api:ci .
