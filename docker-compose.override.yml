# Solo para desarrollo local y el CI: "docker compose up" combina este archivo con
# docker-compose.yml. Construye la imagen desde el código y publica PostgreSQL en
# localhost, en el puerto POSTGRES_PUERTO_HOST.
# El pipeline no copia este archivo a la EC2: en producción PostgreSQL no publica puertos.
services:
  api:
    image: materiales-formulas-api:local
    build: .
    environment:
      ENTORNO: desarrollo

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PUERTO_HOST}:5432"
