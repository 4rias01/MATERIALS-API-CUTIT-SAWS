# Jobs de recolección de Prometheus (vista de despliegue del DAS).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas de la API: peticiones, latencia, llamadas externas, circuit breakers y eventos.
  - job_name: materiales-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          celula: materiales-formulas

  # CPU, memoria y disco del servidor (EC2).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          celula: materiales-formulas

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
