[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
addopts = -ra --strict-markers
markers =
    integracion: necesita PostgreSQL (variable TEST_DATABASE_URL); se omite si no está disponible
    hu: criterio de aceptación del backlog pendiente de implementar
filterwarnings =
    ignore::DeprecationWarning:starlette.*
